<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamada WebRTC</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>📞 Sala de chamada</h1><span id="status">Desconectado</span></header>
<main><section class="join" id="join"><input id="room" placeholder="Código da sala"><button id="joinBtn">Entrar</button><button id="randomBtn" class="secondary">Criar sala</button><p>Abra este mesmo link em outro aparelho e use o mesmo código.</p></section>
<section id="call" class="hidden"><div class="videos"><div class="tile"><video id="remote" autoplay playsinline></video><b>Outra pessoa</b></div><div class="tile local"><video id="local" autoplay muted playsinline></video><b>Você</b></div></div><div class="controls"><button id="mic">🎤 Microfone</button><button id="cam">📷 Câmera</button><button id="screen">🖥️ Compartilhar tela</button><button id="hang" class="danger">☎️ Encerrar</button></div><div class="roomline">Sala: <strong id="roomLabel"></strong> <button id="copy">Copiar código</button></div></section></main>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
